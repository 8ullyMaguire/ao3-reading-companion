<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lorehaven</title>
  <link rel="stylesheet" href="feed.css">
</head>
<body>
  <header class="page-header">
    <div>
      <h1>Lorehaven</h1>
      <p class="tiny" id="instance-line">checking…</p>
    </div>
    <nav>
      <button id="change-instance" class="ghost" type="button">Change instance</button>
      <button id="refresh" class="ghost" type="button">Refresh</button>
    </nav>
  </header>

  <p id="feed-meta" class="tiny"></p>

  <section id="state-setup" hidden></section>
  <section id="state-loading" hidden><p class="muted">Loading the instance's recommendations…</p></section>
  <section id="state-error" hidden>
    <h2>Could not load the feed</h2>
    <p id="error-text" class="muted"></p>
    <p class="tiny">Nothing is shown rather than something invented. The instance may be down,
      or this browser may not be signed in to it. Requests go to your configured instance or
      they do not go (§48.5).</p>
  </section>

  <main id="feed-main" hidden>
    <div id="cards" class="cards"></div>
  </main>

  <script src="db.js"></script>
  <script src="lorehaven.js"></script>
  <script src="cache.js"></script>
  <script src="feed-model.js"></script>
  <script src="feed-page.js"></script>
</body>
</html>
