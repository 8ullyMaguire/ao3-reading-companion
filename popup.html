<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Darkhold Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Darkhold</h1>
  <p>Your instance's recommendations, in its own order.</p>

  <!-- §48.5: the instance is the one setting this extension cannot work without, so it is on
       the popup at all times, never buried behind a settings page. -->
  <div class="instance" id="instance-row">
    <span class="instance-label">Instance</span>
    <span class="instance-value" id="instance-value">not configured</span>
  </div>
  <div class="status" id="status">Loading&hellip;</div>

  <button id="open-darkhold">Open the feed</button>
  <button id="refresh-cache" class="secondary" hidden>Clear the cached feed</button>

  <div class="version">Version 1.0.0</div>
  <script src="db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
